[project]
name = "expedition-tayavision"
version = "0.1.0"
description = "Tiny Aya Vision - Training vision language models as part of the Tiny Aya Expedition"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Core ML framework
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    # HuggingFace ecosystem
    "transformers>=4.49.0",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "huggingface_hub>=0.27.0",
    "tokenizers>=0.21.0",
    "trl>=0.12.0",
    # Tokenizer / serialization
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
    # Image processing
    "Pillow>=10.0.0",
    # Numerical / utilities
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "einops>=0.8.0",
    "requests>=2.32.0",
    # Config management (hydra-zen replaces unmaintained hydra-core)
    "hydra-zen>=0.12.0",
    "omegaconf>=2.3.0",
    # Experiment tracking
    "wandb>=0.16.0",
    "weave>=0.51.12",
    # PEFT / LoRA
    "peft>=0.13.0",
    # Evaluation
    "lm-eval>=0.4.0",
    # Quantization
    "bitsandbytes>=0.43.0",
    # Environment
    "python-dotenv>=1.0.1",
    "modal>=1.3.5",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Ruff's default set, pinned explicitly so a ruff upgrade cannot silently
# change what CI gates on. Widening this (W, I, UP, B, SIM add ~120 findings
# between them) is a deliberate follow-up, not a drive-by.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These two set TORCHINDUCTOR_CACHE_DIR and extend sys.path before importing
# torch and the local packages. The ordering is load-bearing: the env var has
# to be set before inductor initialises, so the imports genuinely cannot move
# to the top of the file.
"pipeline/train_instruct.py" = ["E402"]
"pipeline/train_multilingual.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "requires_gpu: test needs a CUDA device (auto-skipped when unavailable)",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "platform_system == 'Linux'" },
]
